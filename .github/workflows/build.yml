name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, also create a GitHub Release at this tag (e.g. v1.0.0), tagging the built commit"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/StarStringsAutoUpdater/StarStringsAutoUpdater.csproj

      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            EXE_NAME="StarStringsAutoUpdater-v${VERSION}.exe"
          else
            VERSION=""
            EXE_NAME="StarStringsAutoUpdater.exe"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exe_name=$EXE_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file win-x64 exe
        run: >
          dotnet publish src/StarStringsAutoUpdater/StarStringsAutoUpdater.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          ${{ steps.version.outputs.version != '' && format('-p:Version={0}', steps.version.outputs.version) || '' }}
          -o publish

      - name: Name the published exe with its version
        if: steps.version.outputs.exe_name != 'StarStringsAutoUpdater.exe'
        shell: pwsh
        run: Copy-Item -Path "publish/StarStringsAutoUpdater.exe" -Destination "publish/${{ steps.version.outputs.exe_name }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarStringsAutoUpdater-win-x64
          path: publish/${{ steps.version.outputs.exe_name }}

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/${{ steps.version.outputs.exe_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: publish/${{ steps.version.outputs.exe_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
